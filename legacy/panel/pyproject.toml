[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=75", "setuptools_scm[toml]>=6.2", "wheel"]

[project]
name = "ebb_flow_manager"
authors = [{ name = "Peter Hofmeier", email = "phofmeier@googlemail.com" }]
description = "Panel application for managing multiple Ebb Flow Controllers"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = [
    "paho-mqtt>=2.1.0",
    "pandas>=2.2.3",
    "panel>=1.6.0",
    "param",
    "plotly>=6.0.1",
    "pymongo[srv]>=4.8.0",
    "pymongoarrow>=1.7.1",
    "python-dateutil",
    "pyyaml",
    "watchfiles>=1.0.3",
]
dynamic = ["version"]

[project.optional-dependencies]
dev = ["coverage", "pytest>=8.2.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
root = "../.."

[tool.isort]
profile = "black"
src_paths = ["src", "tests", "tools"]
line_length = 88

[tool.mypy]
ignore_missing_imports = true
files = ["src", "tests", "tools"]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
