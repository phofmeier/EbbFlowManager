database:
  collection_config_name: config_static
  collection_crop_profiles_name: crop_profiles
  collection_grow_light_installations_name: grow_light_installations
  collection_grow_lights_name: grow_lights
  collection_grow_selections_name: grow_selections
  collection_heap_size_name: heap_timed
  collection_level_name: level_timed
  collection_status_name: status_static
  connection_string: db:27017
  database_name: efc
  id_field_name: id
logging:
  disable_existing_loggers: false
  formatters:
    f:
      format: "%(asctime)s %(name)-12s %(levelname)-8s %(message)s"
  handlers:
    file:
      backupCount: 14
      class: logging.handlers.TimedRotatingFileHandler
      filename: ./logs/manager.log
      formatter: f
      level: 20
      when: D
    h:
      class: logging.StreamHandler
      formatter: f
      level: 20
  root:
    handlers:
      - h
      - file
    level: 20
  version: 1
mqtt:
  broker: mosquitto
  new_config_publish_topic: ef/efc/config/set
  port: 1883
