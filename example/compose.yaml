services:
  ebbflowmanager:
    build:
      context: ..
      target: frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
        restart: true
    ports:
      - "5006:80"

  api:
    build:
      context: ..
      target: api
    restart: unless-stopped
    volumes:
      - ./manager/config/config.yml:/home/app/config.yml:ro
      - ./manager/logs:/home/app/logs
    depends_on:
      db:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://127.0.0.1:8001/api/controllers', timeout=4)",
        ]
      interval: 5s
      timeout: 5s
      retries: 12

  mqtt2db:
    image: ghcr.io/phofmeier/mqtt2db:latest
    # The published image is amd64-only.
    platform: linux/amd64
    restart: unless-stopped
    command:
      - /bin/sh
      - -ec
      - |
        cp /tmp/mqtt2db-config.yml config.yml
        exec mqtt2db
    volumes:
      - ./mqtt2db/config/config.yml:/tmp/mqtt2db-config.yml:ro
      - ./mqtt2db/logs:/home/app/logs
    depends_on:
      db:
        condition: service_healthy
      mosquitto:
        condition: service_healthy

  db:
    image: mongo:latest
    restart: unless-stopped
    volumes:
      - mongodb-data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "--eval",
          "quit(db.adminCommand({ping: 1}).ok === 1 ? 0 : 1)",
        ]
      interval: 5s
      timeout: 5s
      retries: 12

  mosquitto:
    image: eclipse-mosquitto:latest
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    healthcheck:
      test:
        [
          "CMD",
          "mosquitto_pub",
          "-h",
          "127.0.0.1",
          "-t",
          "compose/health",
          "-n",
          "-q",
          "1",
        ]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  mongodb-data:
