name: unit-tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    name: build (3.13)

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install uv
      - name: Run pytest
        run: uv run --locked --extra dev coverage run -m pytest -v -s
      - name: Generate Coverage Report
        run: uv run --locked --extra dev coverage report -m
      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build Vue
        working-directory: frontend
        run: |
          npm ci
          npm run build
