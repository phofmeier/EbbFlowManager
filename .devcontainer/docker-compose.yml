services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_OPENCODE: "false"
        OPENCODE_VERSION: 2.0.22
    command: sleep infinity
    volumes:
      - ..:/workspace:cached
      - api-venv:/workspace/.venv
      - frontend-modules:/workspace/frontend/node_modules
    depends_on:
      db:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
      mqtt2db:
        condition: service_started

  db:
    image: mongo:latest
    restart: unless-stopped
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "quit(db.adminCommand({ping: 1}).ok === 1 ? 0 : 1)"
      interval: 5s
      timeout: 5s
      retries: 12

  mosquitto:
    image: eclipse-mosquitto:latest
    restart: unless-stopped
    volumes:
      - ../example/mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test:
        - CMD
        - mosquitto_pub
        - -h
        - 127.0.0.1
        - -t
        - compose/health
        - -n
        - -q
        - "1"
      interval: 5s
      timeout: 5s
      retries: 12

  mqtt2db:
    image: ghcr.io/phofmeier/mqtt2db:latest
    platform: linux/amd64
    restart: unless-stopped
    command:
      - /bin/sh
      - -ec
      - |
        cp /tmp/mqtt2db-config.yml config.yml
        exec mqtt2db
    volumes:
      - ../example/mqtt2db/config/config.yml:/tmp/mqtt2db-config.yml:ro
      - mqtt2db-logs:/home/app/logs
    depends_on:
      db:
        condition: service_healthy
      mosquitto:
        condition: service_healthy

volumes:
  api-venv:
  frontend-modules:
  mongodb-data:
  mqtt2db-logs:
